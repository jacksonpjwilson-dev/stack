<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#0c121b"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Stack"/>
<title>Stack</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="css/styles.css"/>
<link rel="apple-touch-icon" href="https://x0.at/B8o6.png"/>
<link rel="icon" type="image/png" href="https://x0.at/B8o6.png"/>

</head>
<body>
<div id="authGate">
  <div class="panel">
    <div class="brandword">Stack</div>
    <h2>Sign in</h2>
    <div class="tiny">Same account on your phone and computer. Data lives in your Firebase project, not only on this device.</div>
    <label>Email</label><input id="authEmail" type="email" autocomplete="email">
    <label>Password</label><input id="authPass" type="password" autocomplete="current-password">
    
    <div id="authCfgWrap" style="display:none">
    <label>Firebase config</label>
    <textarea id="authFb" rows="5" placeholder='Paste the { apiKey: "..." } box here' style="width:100%;background:#111824;color:#e8eef6;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px;font-size:12px"></textarea>
    <button class="btn ghost" onclick="saveFirebaseCfg()">Save config</button>
    </div>
<div id="authMsg"></div>
    <button class="btn" onclick="authSignIn()">Sign in</button>
    <button class="btn ghost" onclick="authRegister()">Create account</button>
    <button class="btn ghost" onclick="authSkip()">Use this device only</button>
  </div>
</div>

<div id="splash"><img src="https://x0.at/B8o6.png" alt="Stack"/><div class="sname">Stack</div><div class="sdot"></div></div>
<div id="app">
<header>
<div class="toprow">
  <div>
    <div class="brandword">Stack</div>
    <h1 class="greet" id="hello">Good morning</h1>
    <small id="todayLabel"></small>
  </div>
  <div class="topactions">
    <button class="icon-btn" title="Sync" onclick="showView('sync')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 2v5h-5M6 22v-5h5"/></svg></button>
    <button class="icon-btn" title="Settings" onclick="showView('settings')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    <button class="avatar" id="avatarBtn" onclick="document.getElementById('avatarPick').click()"></button>
    <input id="avatarPick" type="file" accept="image/*" style="display:none" onchange="setAvatar(event)">
  </div>
</div>
</header>
<main id="content"></main>
<nav class="tabs">
<button class="active" data-view="home" onclick="showView('home')">Home</button>
<button data-view="spending" onclick="showView('spending')">Spending</button>
<button data-view="budgets" onclick="showView('budgets')">Budgets</button>
<button data-view="plan" onclick="showView('plan')">Plan</button>
<button data-view="goals" onclick="showView('goals')">Goals</button>
<button data-view="invest" onclick="showView('invest')" style="display:none">Invest</button>
</nav>
</div>
<div class="sheet" id="sheet" onclick="if(event.target.id==='sheet')closeSheet()"><div class="panel" id="sheetPanel"></div></div>
<script type="module" src="js/app.js?v=41"></script>
</body>
</html>
