<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
:root{
  --bg:#0c121b;
  --card:#171e2a;
  --card2:#1c2433;
  --line:rgba(255,255,255,.06);
  --text:#e8eef6;
  --muted:#8b97a8;
  --gold:#c4a574;
  --steel:#6d8299;
  --green:#3dd68c;
  --red:#ef7a8a;
  --safe-t:env(safe-area-inset-top);
  --safe-b:env(safe-area-inset-bottom);
}
[data-theme=light]{
  --bg:#eef1f5;--card:#fff;--card2:#f7f8fb;--line:rgba(15,23,42,.08);
  --text:#132033;--muted:#66758a;--gold:#9a7b4a;--steel:#5d738c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;letter-spacing:.01em}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-t)}
header{padding:18px 20px 10px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:28px;height:28px;border-radius:8px;background:var(--card);display:grid;place-items:center;color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.08em}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#c5cdd8}
small{color:var(--muted);font-size:11px;letter-spacing:.04em}
.icon-btn{width:38px;height:38px;border-radius:19px;border:0;background:var(--card);color:var(--muted)}
main{flex:1;overflow:auto;padding:4px 18px 118px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%}
.brandword{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#9aa6b5;font-weight:600;margin-bottom:8px}
.greet{font-size:22px;font-weight:650;letter-spacing:-.3px;margin:0}
.topactions{display:flex;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;border:0;padding:0;overflow:hidden;background:#2a3342;color:#d7deea;font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pockets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
.pocket{border-radius:22px;padding:16px 16px 14px;min-height:148px;display:flex;flex-direction:column;justify-content:space-between;color:#f7f4ee;position:relative;overflow:hidden}
.pocket .ic{width:22px;height:22px;opacity:.9;margin-bottom:8px}
.pocket .plabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.78;font-weight:650}
.pocket .plast{font-size:12px;opacity:.7;margin-top:4px;letter-spacing:.16em}
.pocket .pamt{font-size:22px;font-weight:650;letter-spacing:-.4px}
.pocket .phint{font-size:11px;opacity:.6;margin-top:4px}
.pocket .goldline{width:36px;height:2px;background:rgba(212,175,106,.85);margin:10px 0 0}
.pocket.chq{background:linear-gradient(160deg,#6a849c 0%,#4a6076 48%,#3a4e62 100%)}
.pocket.sav{background:linear-gradient(160deg,#c4b08a 0%,#a48b62 48%,#8a704c 100%)}
.pocket.efund{grid-column:1/-1;min-height:118px;background:linear-gradient(160deg,#5c7a72 0%,#3d5852 52%,#2c423e 100%)}
.totalcard{background:var(--card);border-radius:22px;padding:16px 16px 14px;margin-bottom:14px;border:1px solid var(--line)}
.totalcard .tiny{letter-spacing:.08em;text-transform:uppercase}
.totalcard .amount{font-size:26px;font-weight:650;letter-spacing:-.5px;margin:4px 0 0}
.goldline{width:42px;height:2px;background:var(--gold);border-radius:2px;margin:8px 0 0}
.tx-ico{width:36px;height:36px;border-radius:12px;background:#222b38;display:grid;place-items:center;flex-shrink:0;color:#c9d3e0}
.tx-ico svg{width:18px;height:18px}
.sec-link{color:var(--muted);font-size:12px;background:none;border:0;padding:0}
.label{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.value{font-size:30px;font-weight:650;margin:4px 0 10px;letter-spacing:-.5px}
.hero-grid,.kpi,.split,.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.tiny,.muted{color:var(--muted);font-size:12px}
.pos{color:var(--green)}.neg{color:var(--red)}.gold{color:var(--gold)}
.section-title{display:flex;justify-content:space-between;margin:22px 4px 10px;font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.title{font-weight:600}.amount{font-weight:650}
.chip{font-size:10px;letter-spacing:.04em;padding:3px 8px;border-radius:99px;background:rgba(61,214,140,.12);color:var(--green)}
.chip.debt{background:rgba(239,122,138,.12);color:var(--red)}
.bar{height:4px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--gold)}
nav.tabs{position:fixed;left:16px;right:16px;bottom:calc(12px + var(--safe-b));background:rgba(23,30,42,.88);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:1fr 1fr 56px 1fr 1fr;padding:6px 4px;z-index:20;align-items:center}
nav.tabs button{background:none;border:0;color:#6f7b8c;font-size:10px;font-weight:600;padding:10px 0;letter-spacing:.02em}
.tab-add{width:44px;height:44px;border-radius:14px;background:var(--card2)!important;color:var(--text)!important;font-size:24px;font-weight:500;justify-self:center;padding:0!important}
nav.tabs button.active{color:var(--text)}
.fab{display:none!important}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end}.sheet.open{display:flex}
.panel{width:100%;background:#141b27;border-radius:24px 24px 0 0;padding:12px 18px calc(20px + var(--safe-b));max-height:88dvh;overflow:auto}
.handle{width:36px;height:4px;background:#2a3444;border-radius:99px;margin:4px auto 14px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:650;background:var(--gold);color:#1a140c;margin-top:16px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#5a2228;color:#fecaca}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.list-item{padding:14px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}
.install{border:1px dashed var(--line);border-radius:18px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:7px 10px;font-size:12px}
.env-amt{width:108px;text-align:right;padding:8px 10px}
.choice button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:16px 10px;font-weight:650}
.tag{font-size:11px;color:var(--muted)}
.cat-dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:6px}
table.months{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.months th{text-align:left;color:var(--muted);font-weight:600;padding:8px 4px;letter-spacing:.06em;font-size:11px;text-transform:uppercase}
table.months td{padding:10px 4px;border-top:1px solid var(--line)}
table.months td.r{text-align:right}

.heroes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
.hero{border-radius:22px;padding:16px 16px 14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;color:#f7f4ee}
.hero .tiny,.hero .plabel{color:rgba(247,244,238,.72)}
.hero .amount,.hero .pamt{color:#f7f4ee}
.hero.blue{background:linear-gradient(160deg,#6a849c 0%,#4a6076 48%,#3a4e62 100%)}
.hero.gold{background:linear-gradient(160deg,#c4b08a 0%,#a48b62 48%,#8a704c 100%)}
.hero.green{background:linear-gradient(160deg,#5c7a72 0%,#3d5852 52%,#2c423e 100%)}
.hero.wide{grid-column:1/-1;min-height:100px}
.card.tint-blue{background:linear-gradient(180deg,#1a2433 0%,#171e2a 70%);border:1px solid rgba(106,132,156,.28)}
.card.tint-gold{background:linear-gradient(180deg,#242018 0%,#171e2a 72%);border:1px solid rgba(196,176,138,.22)}
.card.tint-green{background:linear-gradient(180deg,#182422 0%,#171e2a 72%);border:1px solid rgba(92,122,114,.28)}
.card.rail{position:relative;padding-left:18px}
.card.rail:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--gold)}
.card.rail.blue:before{background:#6a849c}
.pay-row.got .tiny{color:var(--gold)}
.section-title{color:#9aa6b5}


#splash{position:fixed;inset:0;z-index:9999;background:#0c121b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .55s ease,visibility .55s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash img{width:96px;height:96px;border-radius:22px;object-fit:cover;box-shadow:0 18px 40px rgba(0,0,0,.35)}
#splash .sname{letter-spacing:.32em;text-transform:uppercase;font-size:13px;font-weight:650;color:#e8eef6}
#splash .sdot{width:6px;height:6px;border-radius:50%;background:#c4a574;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}


#authGate{position:fixed;inset:0;z-index:10000;background:#0c121b;display:none;align-items:center;justify-content:center;padding:24px}
#authGate.show{display:flex}
#authGate .panel{width:min(400px,100%);background:#171e2a;border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:22px}
#authGate h2{margin:0 0 8px;font-size:22px}
#authGate .tiny{margin-bottom:14px}
#authMsg{color:#ef7a8a;font-size:13px;min-height:18px;margin:8px 0}

</style>
</head>
<body>
<div id="authGate">
  <div class="panel">
    <div class="brandword">Stack</div>
    <h2>Sign in</h2>
    <div class="tiny">Same account on your phone and computer. Data lives in your Firebase project, not only on this device.</div>
    <label>Email</label><input id="authEmail" type="email" autocomplete="email">
    <label>Password</label><input id="authPass" type="password" autocomplete="current-password">
    
    <div id="authCfgWrap" style="display:none">
    <label>Firebase config</label>
    <textarea id="authFb" rows="5" placeholder='Paste the { apiKey: "..." } box here' style="width:100%;background:#111824;color:#e8eef6;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px;font-size:12px"></textarea>
    <button class="btn ghost" onclick="saveFirebaseCfg()">Save config</button>
    </div>
<div id="authMsg"></div>
    <button class="btn" onclick="authSignIn()">Sign in</button>
    <button class="btn ghost" onclick="authRegister()">Create account</button>
    <button class="btn ghost" onclick="authSkip()">Use this device only</button>
  </div>
</div>

<div id="splash"><img src="https://x0.at/B8o6.png" alt="Stack"/><div class="sname">Stack</div><div class="sdot"></div></div>
<script>
setTimeout(function(){var s=document.getElementById("splash");if(s)s.classList.add("hide");},2500);
setTimeout(function(){var s=document.getElementById("splash");if(s)s.remove();},3000);
</script>
<div id="app">
<header>
<div class="toprow">
  <div>
    <div class="brandword">Stack</div>
    <h1 class="greet" id="hello">Good morning</h1>
    <small id="todayLabel"></small>
  </div>
  <div class="topactions">
    <button class="icon-btn" title="Settings" onclick="showView('settings')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1.1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="avatar" id="avatarBtn" onclick="document.getElementById('avatarPick').click()"></button>
    <input id="avatarPick" type="file" accept="image/*" style="display:none" onchange="setAvatar(event)">
  </div>
</div>
</header>
<main id="content"></main>
<nav class="tabs">
<button class="active" data-view="home" onclick="showView('home')">Home</button>
<button data-view="money" onclick="showView('money')">Money</button>
<button class="tab-add" onclick="openAdd()">+</button>
<button data-view="plan" onclick="showView('plan')">Plan</button>

</nav>

<script>
const FIREBASE={
  apiKey:"AIzaSyDbu0afHoeESWJmoRBiEABdf5UzyzI0DRo",
  authDomain:"stackapphtml.firebaseapp.com",
  projectId:"stackapphtml",
  storageBucket:"stackapphtml.firebasestorage.app",
  messagingSenderId:"1038191511612",
  appId:"1:1038191511612:web:98be6b660a6062704d1b39",
  measurementId:"G-5SYSRZNGTV"
};
const KEY="stack.generic.v1";
const CATS=[["Housing","#60a5fa"],["Groceries","#34d399"],["Dining","#fbbf24"],["Transport","#22d3ee"],["Utilities","#a78bfa"],["Health","#fb7185"],["Entertainment","#f472b6"],["Shopping","#fb923c"],["Subscriptions","#818cf8"],["Travel","#2dd4bf"],["Education","#c084fc"],["Other","#94a3b8"]];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const monthKey=(iso=todayISO())=>iso.slice(0,7);
const daysBetween=(a,b)=>Math.max(0,Math.floor((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function addMonths(iso,n){const d=new Date(iso+"T12:00:00");const day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function monthEnd(mk){const [y,m]=mk.split("-").map(Number);const ny=m===12?y+1:y,nm=m===12?1:m+1;return addDays(`${ny}-${pad(nm)}-01`,-1);}
function nextFirst(){return addMonths(todayISO().slice(0,8)+"01",1);}
function daysLeftInMonth(){return Math.max(1,daysBetween(todayISO(),monthEnd(monthKey())));}
function defaultState(){return{settings:{name:"",currency:"CAD",symbol:"$",theme:"dark",chequing:0,savings:0,emergency:0,cheqName:"Chequing",savName:"Savings",efundName:"Emergency",cheqLast4:"",savLast4:"",efundLast4:"",avatar:"",incomeAccount:"chequing",forecastDate:nextFirst()},income:[],spend:[],debts:[],invest:[],jobs:[],bills:[],envelopes:[],goals:[],transfers:[]};}
function load(){let raw={};try{raw=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem("finly.v1")||"{}");}catch(e){raw={};}const s=defaultState();Object.assign(s,raw);s.settings=Object.assign(defaultState().settings,raw.settings||{});["jobs","bills","envelopes","goals","income","spend","debts","invest"].forEach(k=>s[k]=raw[k]||s[k]||[]);if(!s.settings.name)s.settings.name="";if(!s.settings.cheqName)s.settings.cheqName="Chequing";if(!s.settings.savName)s.settings.savName="Savings";seedJobs(s);seedDebts(s);return s;}
function seedJobs(s){}
function seedDebts(s){}
const FB_LS="stack.fb.cfg";
let fbApp=null,fbAuth=null,fbDb=null,fbUser=null,fbSkip=false,saveTimer=null;
function fbConfig(){
  const ok=c=>c&&c.apiKey&&String(c.apiKey).trim()&&c.projectId&&String(c.projectId).trim();
  try{const x=JSON.parse(localStorage.getItem(FB_LS)||"null");if(ok(x))return x;}catch(e){}
  const s=S&&S.settings&&S.settings.firebase;
  if(ok(s))return s;
  if(ok(FIREBASE))return FIREBASE;
  return null;
}
function initFirebase(){
  const cfg=fbConfig();
  if(!cfg||typeof firebase==="undefined")return false;
  try{
    if(!fbApp){fbApp=firebase.initializeApp(cfg);fbAuth=firebase.auth();fbDb=firebase.firestore();}
    if(!initFirebase._listen){
      initFirebase._listen=true;
      fbAuth.onAuthStateChanged(async u=>{
        fbUser=u||null;
        if(u){fbSkip=false;hideAuth();authMsg("");pullCloud().then(()=>render()).catch(e=>console.warn(e));}
        else if(!fbSkip)showAuth();
        render();
      });
    }
    return true;
  }catch(e){console.warn(e);return false;}
}
function showAuth(){const g=document.getElementById("authGate");if(g)g.classList.add("show");}
function hideAuth(){const g=document.getElementById("authGate");if(g)g.classList.remove("show");}
function authMsg(t){const el=document.getElementById("authMsg");if(el)el.textContent=t||"";}
function ensureFbFromBox(){
  if(fbAuth)return true;
  const box=document.getElementById("authFb")||document.getElementById("f-fb");
  const cfg=parseFbCfg(box&&box.value)||fbConfig();
  if(!cfg||typeof firebase==="undefined")return false;
  try{
    if(!fbApp){fbApp=firebase.initializeApp(cfg);fbAuth=firebase.auth();fbDb=firebase.firestore();}
    localStorage.setItem(FB_LS,JSON.stringify(cfg));
    return !!fbAuth;
  }catch(e){console.warn(e);return false;}
}
async function authSignIn(){
  authMsg("");
  const email=val("authEmail"),pass=val("authPass");
  if(!ensureFbFromBox()){authMsg("Paste the Firebase { apiKey } box above, then tap Save config.");return;}
  try{authMsg("Signing in…");await fbAuth.signInWithEmailAndPassword(email,pass);}
  catch(e){authMsg(e.message||"Sign in failed");}
}
async function authRegister(){
  authMsg("");
  const email=val("authEmail"),pass=val("authPass");
  if(!ensureFbFromBox()){authMsg("Paste the Firebase { apiKey } box above, then tap Save config.");return;}
  try{authMsg("Creating account…");await fbAuth.createUserWithEmailAndPassword(email,pass);}
  catch(e){authMsg(e.message||"Could not create account");}
}
function authSkip(){fbSkip=true;hideAuth();}
async function authSignOut(){if(fbAuth)await fbAuth.signOut();fbUser=null;showAuth();}
async function pullCloud(){
  if(!fbDb||!fbUser)return;
  try{
    const snap=await Promise.race([
      fbDb.doc("stack/"+fbUser.uid).get(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000))
    ]);
    if(snap.exists){
      const raw=snap.data().state;
      if(raw&&typeof raw==="object"){
        const s=defaultState();
        Object.assign(s,raw);
        s.settings=Object.assign(defaultState().settings,raw.settings||{});
        ["jobs","bills","envelopes","goals","income","spend","debts","invest"].forEach(k=>s[k]=Array.isArray(raw[k])?raw[k]:s[k]);
        S=s;
        localStorage.setItem(KEY,JSON.stringify(S));
      }
    }else{
      await pushCloud();
    }
  }catch(e){console.warn("pull",e);}
}
async function pushCloud(){
  if(!fbDb||!fbUser)return;
  try{await fbDb.doc("stack/"+fbUser.uid).set({state:S,updatedAt:Date.now()});S._lastSync=Date.now();}
  catch(e){console.warn("push",e);}
}
function parseFbCfg(raw){
  if(!raw)return null;
  let t=String(raw).trim();

function take(acc,key,need){const t=Math.min(Math.max(acc[key]||0,0),need);acc[key]=(acc[key]||0)-t;return need-t;}
function applyDraw(acc,amt,from){let a=Number(amt)||0;if(a<=0)return;
  const order={

    "emergency-then-savings":["emergency","savings","chequing"]

}

function runDuePayments(){
  let changed=false;
  (S.bills||[]).forEach(b=>{
    if(!b.created)b.created=todayISO();
    if(!b.auto)return;
    let guard=0;
    while(b.next&&b.next<=todayISO()&&guard++<6){
      const key=b.next;
      b.paid=b.paid||{};b.cleared=b.cleared||{};b.drawn=b.drawn||{};
      const beforeApp=key<b.created;
      if(!b.paid[key]&&!beforeApp){chargeBill(b);b.drawn[key]=true;changed=true;}
      b.paid[key]=true;b.cleared[key]=true;
      if(beforeApp)b.drawn[key]=true;
      b.next=nextPayDate({frequency:b.frequency||"monthly",lastPayDate:key},key);
      changed=true;
    }
  });
  (S.debts||[]).forEach(d=>{
    if(!d.auto||!(Number(d.minPay)>0))return;
    const start=d.repayFrom||d.start;
    if(start&&todayISO()<start)return;
    const m=monthKey();
    d.autoPaid=d.autoPaid||{};
    if(d.autoPaid[m])return;
    drawPockets(d.minPay,d.from||"savings-then-chequing");
    d.principal=Math.max(0,Number(d.principal||0)-Number(d.minPay));
    d.paidMonth=d.paidMonth||{};
    d.paidMonth[m]=(Number(d.paidMonth[m])||0)+Number(d.minPay);
    d.autoPaid[m]=true;changed=true;
  });
  if(changed)save();
}

function monthPath(n=6){const acc={chequing:Number(S.settings.chequing)||0,savings:Number(S.settings.savings)||0,emergency:Number(S.settings.emergency)||0};const dest=S.settings.incomeAccount||"chequing";const rows=[];let cursor=monthKey();

function openEdit(kind,id){editing={kind,id};const map={spend:"spend",income:"income",debt:"debts",invest:"invest",job:"jobs",bill:"bills",envelope:"envelopes",goal:"goals"};openSheet(formHTML(kind,S[map[kind]].find(x=>x.id===id)));}

function freqOpts(cur){return[["weekly","Weekly"],["biweekly","Every 2 weeks"],["semimonthly","1st & 15th"],["monthly","Monthly"]].map(([v,l])=>`<option value="${v}" ${v===cur?"selected":""}>${l}</option>`).join("");}
function destOpts(cur){return [["emergency",S.settings.efundName||"Emergency fund"],["savings",S.settings.savName||"Savings"],["chequing",S.settings.cheqName||"Chequing"]].map(([v,l])=>`<option value="${v}" ${v===(cur||"emergency")?"selected":""}>${l}</option>`).join("");}
function accountOpts(cur){return [["chequing",S.settings.cheqName||"Chequing"],["savings",S.settings.savName||"Savings"],["emergency",S.settings.efundName||"Emergency"],["savings-then-chequing","Savings then chequing"],["chequing-then-savings","Chequing then savings"],["emergency-then-savings","Emergency, then savings"]].map(([v,l])=>`<option value="${v}" ${v===(cur||"chequing")?"selected":""}>${l}</option>`).join("");}

if(kind==="jobHourly"||(kind==="job"&&item.kind==="hourly"))return `<h3>Hourly job</h3><label>Name</label><input id="f-name" value="${esc(item.name||"Part-time")}"><label>$/hour after deductions</label><input id="f-rate" type="number" step="0.01" value="${item.hourlyRate??20.4}"><div class="split"><div><label>Last payday</label><input id="f-date" type="date" value="${item.lastPayDate||"2026-09-11"}"></div><div><label>Lag days</label><input id="f-lag" type="number" value="${item.payLagDays??8}"></div></div><div class="tiny">Aug 21–Sept 3 is paid Sept 11.</div><button class="btn" onclick="saveJob('hourly')">Save</button><button class="btn ghost" onclick="openHours('${item.id||""}')">Log hours</button>${item.id?`<button class="btn danger" onclick="delItem('jobs','${item.id}')">Delete</button>`:""}<button class="btn ghost" onclick="closeSheet()">Cancel</button>`;

if(kind==="income")return `<h3>One-time pay</h3><label>Name</label><input id="f-name" value="${esc(item.name||"")}"><label>Amount</label><input id="f-amt" type="number" step="0.01" value="${item.amount||""}"><label>Date</label><input id="f-date" type="date" value="${d}"><button class="btn" onclick="saveIncome()">Save</button><button class="btn ghost" onclick="closeSheet()">Cancel</button>`;
if(kind==="bill")return `<h3>Bill</h3><label>Name</label><input id="f-name" value="${esc(item.name||(item.mode==="transfer"?"To emergency fund":"Rent"))}"><label>What it does</label><select id="f-mode" onchange="document.getElementById('f-to-wrap').style.display=this.value==='transfer'?'block':'none'"><option value="pay" ${item.mode!=="transfer"?"selected":""}>Pay out (leaves my accounts)</option><option value="transfer" ${item.mode==="transfer"?"selected":""}>Move to another account</option></select>
<label>Amount</label><input id="f-amt" type="number" step="0.01" value="${item.amount||""}"><div class="split"><div><label>Frequency</label><select id="f-freq">${freqOpts(item.frequency||"monthly")}</select></div><div><label>Next due</label><input id="f-date" type="date" value="${item.next||item.date||d}"></div></div><label>From</label><select id="f-from">${accountOpts(item.from||"chequing")}</select>
<div id="f-to-wrap" style="display:${item.mode==="transfer"?"block":"none"}"><label>To</label><select id="f-to">${destOpts(item.to||"emergency")}</select></div>
<label class="tiny" style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0"><input id="f-auto" type="checkbox" ${item.id?item.auto?"checked":"":"checked"} style="width:18px"> Auto-run when due</label>
<button class="btn" onclick="saveBill()">Save</button>${item.id?`<button class="btn danger" onclick="delItem('bills','${item.id}')">Delete</button>`:""}<button class="btn ghost" onclick="closeSheet()">Cancel</button>`;
if(kind==="debt")return `<h3>Debt</h3><label>Name</label><input id="f-name" value="${esc(item.name||"")}"><div class="split"><div><label>Principal</label><input id="f-amt" type="number" step="0.01" value="${item.principal||""}"></div><div><label>APR %</label><input id="f-apr" type="number" step="0.01" value="${item.apr??0}"></div></div><div class="split"><div><label>Auto min / mo</label><input id="f-min" type="number" step="0.01" value="${item.minPay||""}"></div><div><label>Started</label><input id="f-date" type="date" value="${item.start||d}"></div></div><label>Min payments start</label><input id="f-repay" type="date" value="${item.repayFrom||item.start||""}"><label>Pay from</label><select id="f-from">${accountOpts(item.from||"savings-then-chequing")}</select><label class="tiny" style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0"><input id="f-auto" type="checkbox" ${item.auto?"checked":""} style="width:18px"> Auto-pay the min each month after the start date</label>
<label>Note</label><input id="f-note" value="${esc(item.note||"")}"><button class="btn" onclick="saveDebt()">Save</button>${item.id?`<button class="btn" onclick="logDebtPay('${item.id}')">Log extra payment this month</button><button class="btn danger" onclick="delItem('debts','${item.id}')">Delete</button>`:""}<button class="btn ghost" onclick="closeSheet()">Cancel</button>`;
if(kind==="invest")return `<h3>Investment</h3><label>Name</label><input id="f-name" value="${esc(item.name||"TFSA")}"><div class="split"><div><label>Value</label><input id="f-amt" type="number" step="0.01" value="${item.value||""}"></div><div><label>Cost</label><input id="f-cost" type="number" step="0.01" value="${item.cost||""}"></div></div><label>Type</label><input id="f-type" value="${esc(item.type||"TFSA")}"><button class="btn" onclick="saveInvest()">Save</button>${item.id?`<button class="btn danger" onclick="delItem('invest','${item.id}')">Delete</button>`:""}<button class="btn ghost" onclick="closeSheet()">Cancel</button>`;
if(kind==="envelope")return `<h3>Envelope</h3><label>Name</label><input id="f-name" value="${esc(item.name||"Groceries")}"><label>Monthly amount</label><input id="f-amt" type="number" step="0.01" value="${item.amount||""}"><label>Kind</label><select id="f-kind"><option value="spend" ${item.kind!=="debt"&&item.kind!=="invest"?"selected":""}>Spending</option><option value="debt" ${item.kind==="debt"?"selected":""}>Debt</option><option value="invest" ${item.kind==="invest"?"selected":""}>Invest</option></select><label>Category match</label><input id="f-cat" value="${esc(item.category||item.name||"Groceries")}">
<label>Fill from</label><select id="f-from">${accountOpts(item.from||"chequing")}</select>
<div class="tiny">Fill only earmarks a slice of chequing. The chequing total does not drop until you spend from that pot.</div>
<button class="btn" onclick="saveEnv()">Save</button>${item.id?`<button class="btn danger" onclick="delItem('envelopes','${item.id}')">Delete</button>`:""}<button class="btn ghost" onclick="closeSheet()">Cancel</button>`;
if(kind==="goal")return `<h3>Goal</h3><label>Name</label><input id="f-name" value="${esc(item.name||"")}"><div class="split"><div><label>Target</label><input id="f-amt" type="number" step="0.01" value="${item.target||""}"></div><div><label>Saved so far</label><input id="f-saved" type="number" step="0.01" value="${item.saved||""}"></div></div><label>Need it by</label><input id="f-date" type="date" value="${item.date||addMonths(todayISO(),12)}"><button class="btn" onclick="saveGoal()">Save</button>${item.id?`<button class="btn danger" onclick="delItem('goals','${item.id}')">Delete</button>`:""}<button class="btn ghost" onclick="closeSheet()">Cancel</button>`;
return `<h3>Add</h3><button class="btn ghost" onclick="closeSheet()">Close</button>`;}

function saveForecast(){S.settings.chequing=num("f-chq");S.settings.savings=num("f-sav");S.settings.emergency=num("f-ef");S.settings.cheqLast4=val("f-chq4").replace(/\D/g,"").slice(-4);S.settings.savLast4=val("f-sav4").replace(/\D/g,"").slice(-4);S.settings.efundLast4=val("f-ef4").replace(/\D/g,"").slice(-4);save();closeSheet();render();}
function saveTransfer(){const amt=num("f-amt"),src=val("f-src"),dst=val("f-dst");if(amt<=0||!src||src===dst)return;const keys={chequing:"chequing",savings:"savings",emergency:"emergency"};
S.settings[keys[src]]=Math.max(0,(Number(S.settings[keys[src]])||0)-amt);
S.settings[keys[dst]]=(Number(S.settings[keys[dst]])||0)+amt;save();closeSheet();render();}
function saveJob(kind){const id=editing?.id||uid(),old=S.jobs.find(j=>j.id===id)||{};const rec={...old,id,name:val("f-name")||kind,kind,frequency:val("f-freq")||"biweekly",lastPayDate:val("f-date")||todayISO(),payLagDays:num("f-lag")};if(!Number.isFinite(rec.payLagDays))rec.payLagDays=8;if(kind==="salary")rec.amount=num("f-amt");else rec.hourlyRate=num("f-rate");upsert("jobs",rec);syncJobPays();closeSheet();render();}
function saveSpend(){
  const old=editing?.id?S.spend.find(x=>x.id===editing.id):null;
  if(old)creditPockets(old.amount,old.from||"chequing");
  const rec={id:editing?.id||uid(),name:val("f-name"),amount:num("f-amt"),category:val("f-cat")||"Groceries",date:val("f-date")||todayISO(),from:val("f-from")||"chequing"};
  upsert("spend",rec);
  drawPockets(rec.amount,rec.from);
  closeSheet();render();
}
function saveIncome(){upsert("income",{id:editing?.id||uid(),name:val("f-name"),amount:num("f-amt"),date:val("f-date")||todayISO()});closeSheet();render();}
function skipPastDues(b,charge){
  let g=0;
  while(b.next&&b.next<=todayISO()&&g++<36){
    const due=b.next;
    b.paid=b.paid||{};b.cleared=b.cleared||{};b.drawn=b.drawn||{};
    if(charge&&!b.drawn[due]&&!b.paid[due]){chargeBill(b);b.drawn[due]=true;}
    b.paid[due]=true;b.cleared[due]=true;
    if(!charge)b.drawn[due]=true;
    b.next=nextPayDate({frequency:b.frequency||"monthly",lastPayDate:due},due);
  }
}
function saveBill(){
  S.bills=S.bills||[];
  const prev=editing?.id?(S.bills.find(b=>b.id===editing.id)||{}):{};
  const isNew=!editing?.id;
  const rec={...prev,id:editing?.id||uid(),name:val("f-name"),amount:num("f-amt"),frequency:val("f-freq")||"monthly",next:val("f-date"),from:val("f-from"),to:val("f-to")||"emergency",mode:val("f-mode")||"pay",auto:document.getElementById("f-auto")?document.getElementById("f-auto").checked:true,created:prev.created||todayISO(),paid:prev.paid||{},cleared:prev.cleared||{},drawn:prev.drawn||{}};
  if(isNew)skipPastDues(rec,false);
  upsert("bills",rec);closeSheet();render();
}
function saveDebt(){const old=S.debts.find(d=>d.id===editing?.id)||{};upsert("debts",{...old,id:editing?.id||uid(),name:val("f-name"),principal:num("f-amt"),apr:num("f-apr"),minPay:num("f-min"),start:val("f-date"),repayFrom:val("f-repay")||val("f-date"),from:val("f-from"),note:val("f-note"),auto:!!document.getElementById("f-auto")?.checked});closeSheet();render();}
function saveInvest(){upsert("invest",{id:editing?.id||uid(),name:val("f-name"),value:num("f-amt"),cost:num("f-cost"),type:val("f-type")});closeSheet();render();}
function saveEnv(){const old=editing?.id?(S.envelopes.find(e=>e.id===editing.id)||{}):{};upsert("envelopes",{...old,id:editing?.id||uid(),name:val("f-name"),amount:num("f-amt"),kind:val("f-kind")||"spend",category:val("f-cat")||val("f-name"),from:val("f-from")||"chequing"});closeSheet();render();}
function saveGoal(){upsert("goals",{id:editing?.id||uid(),name:val("f-name"),target:num("f-amt"),saved:num("f-saved"),date:val("f-date")});closeSheet();render();}
function delEnvelope(id){const e=S.envelopes.find(x=>x.id===id);if(!e)return;if(!confirm("Delete "+e.name+"?"))return;S.envelopes=S.envelopes.filter(x=>x.id!==id);save();render();}
function delItem(list,id){S[list]=S[list].filter(x=>x.id!==id);save();closeSheet();render();}
function setEnvelopeAmt(id,v){const e=S.envelopes.find(x=>x.id===id);if(e){e.amount=parseFloat(v||0)||0;save();render();}}
function addQuickEnvelope(n,k,c){S.envelopes.push({id:uid(),name:n,kind:k,category:c,amount:0});save();render();}
function logDebtPay(id){const d=S.debts.find(x=>x.id===id);if(!d)return;const amt=parseFloat(prompt("Payment amount this month?",String(d.minPay||300))||"0")||0;if(!amt)return;d.paidMonth=d.paidMonth||{};const m=monthKey();d.paidMonth[m]=(Number(d.paidMonth[m])||0)+amt;d.principal=Math.max(0,Number(d.principal)-amt);drawPockets(amt,d.from||"savings-then-chequing");save();closeSheet();render();}
function accountBal(from){const a=pocketAcc();
  if(from==="savings"||from==="savings-then-chequing")return (a.savings||0)+(a.chequing||0);
  if(from==="emergency"||from==="emergency-then-savings")return (a.emergency||0)+(a.savings||0)+(a.chequing||0);
  if(from==="chequing-then-savings")return (a.chequing||0)+(a.savings||0);
  return a.chequing||0;
}
function billDue(b){return b.next||b.date||todayISO();}
function billIsPaid(b){
  const due=billDue(b);b.cleared=b.cleared||{};
  if(Object.prototype.hasOwnProperty.call(b.cleared,due))return !!b.cleared[due];
  if((b.paid||{})[due]||(b.drawn||{})[due])return true;
  return false;
}
function toggleBillPaid(id){
  const b=S.bills.find(x=>x.id===id);if(!b)return;
  const due=billDue(b);const on=!billIsPaid(b);
  b.cleared=b.cleared||{};b.cleared[due]=on;
  b.drawn=b.drawn||{};
  if(on&&!b.drawn[due]){chargeBill(b);b.drawn[due]=true;b.paid=b.paid||{};b.paid[due]=true;}
  if(!on&&b.drawn[due]){reverseBill(b);b.drawn[due]=false;if(b.paid)delete b.paid[due];}
  save();render();
}
function markBillPaid(id){toggleBillPaid(id);}
function lastSpendUndo(){const x=[...S.spend].sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];if(!x)return alert("No spend to undo.");if(!confirm("Undo "+(x.name||x.category)+" "+money(x.amount)+"?"))return;
  creditPockets(x.amount,x.from||"chequing");
  S.spend=S.spend.filter(s=>s.id!==x.id);save();render();}
function currentHourlyPay(job){return upcomingPayPeriods(job,10).find(d=>{const {start}=periodBounds(job,d);return todayISO()>=start&&todayISO()<=d;})||nextPayday(job);}
function hoursForPay(job,pay){const sch=(job.schedule||{})[pay]||{};if(sch.hours===""||(sch.hours==null&&sch.w1==null&&sch.w2==null))return defaultPeriodHours(job)||"";const n=Number(sch.hours);if(!isNaN(n)&&sch.hours!==""&&sch.hours!=null)return n;const w=(Number(sch.w1)||0)+(Number(sch.w2)||0);return w||defaultPeriodHours(job)||"";}
function fillHoursPeriod(jobId){const job=S.jobs.find(j=>j.id===jobId);if(!job)return;const pay=val("f-pay");const {start,end}=periodBounds(job,pay);const el=document.getElementById("f-range");if(el)el.textContent="Work "+start+" → "+end+" · paid "+pay;const inp=document.getElementById("f-hours");if(inp){const v=hoursForPay(job,pay);inp.value=v===0||v===""?"":v;}}
function openHours(id){const job=S.jobs.find(j=>j.id===id)||S.jobs.find(j=>j.kind==="hourly");if(!job)return;const periods=upcomingPayPeriods(job,10);const cur=currentHourlyPay(job);
const opts=periods.map(pay=>{const {start,end}=periodBounds(job,pay);const h=hoursForPay(job,pay);const lab=start+" → "+end+" · paid "+pay+(h!==""?" · "+h+"h":"");return `<option value="${pay}" ${pay===cur?"selected":""}>${lab}</option>`;}).join("");
const {start,end}=periodBounds(job,cur);
openSheet(`<h3>Hours · ${esc(job.name)}</h3>
<label>Pay period</label>
<select id="f-pay" onchange="fillHoursPeriod('${job.id}')">${opts}</select>
<div class="tiny" id="f-range">Work ${start} → ${end} · paid ${cur}</div>
<label>Hours this period</label>
<input id="f-hours" type="number" step="0.25" inputmode="decimal" value="${hoursForPay(job,cur)}">
<div class="tiny">Whole 2-week block. Leave blank = 0 hours. Overtime is 44h/week, so 88h across the period.</div>
<button class="btn" onclick="saveHours('${job.id}')">Save hours</button><button class="btn ghost" onclick="closeSheet()">Cancel</button>`);}
function saveHours(id){const job=S.jobs.find(j=>j.id===id);if(!job)return;const pay=val("f-pay")||currentHourlyPay(job);job.schedule=job.schedule||{};const raw=val("f-hours");if(raw===""){delete job.schedule[pay];}else job.schedule[pay]={hours:num("f-hours")};save();closeSheet();render();}

function paydayStrip(){return `<div class="section-title">This pay cycle</div><div class="card">${S.jobs.map(j=>{const pay=nextPayday(j),{start,end}=periodBounds(j,pay);
return `<div class="list-item"><div class="row"><div><div class="title">${esc(j.name)}</div><div class="tiny">Work ${start} → ${end}</div></div><div style="text-align:right"><div class="amount pos">${money(estimatePay(j,pay))}</div><div class="tiny">paid ${pay}</div></div></div></div>`;}).join("")}
<button class="btn ghost" onclick="const h=S.jobs.find(j=>j.kind==='hourly');if(h)openHours(h.id)">Log hourly hours</button>
<button class="btn ghost" onclick="openSheet(formHTML('transfer'))">Move between accounts</button></div>`;}
function tightEnvelopes(){const rows=(S.envelopes||[]).map(e=>{const used=envelopeUsed(e),cap=Number(e.amount)||0;return{e,remain:cap-used,cap};}).filter(x=>x.cap).sort((a,b)=>a.remain-b.remain).slice(0,2);
if(!rows.length)return "";return `<div class="section-title">Tight this month</div><div class="card">${rows.map(({e,remain})=>`<div class="list-item" onclick="openPot('${e.id}')"><div class="row"><div class="title">${esc(e.name)}</div><div class="amount ${remain<0?"neg":"pos"}">${remain<0?"Over "+money(Math.abs(remain)):money(remain)+" left"}</div></div></div>`).join("")}</div>`;}

function homeHTML(){const path=monthPath(1),monthEndRow=path[0]||{total:liquidCash(),delta:0};
const recent=[...S.spend.map(x=>({...x,dir:-1,label:x.name||x.category,kind:x.category}))].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,4);
return `<div class="tiny" style="margin:0 4px 10px">${cloudStatus()}</div><div class="pockets">
  <div class="pocket chq" onclick="openAdd('forecast')"><div><div class="plabel">${esc(S.settings.cheqName||"Chequing")} account</div>${mask4(S.settings.cheqLast4)?`<div class="plast">${mask4(S.settings.cheqLast4)}</div>`:""}</div><div><div class="phint">Total · ${money(potReserved())} in pots</div><div class="pamt">${money(S.settings.chequing)}</div><div class="goldline"></div></div></div>
  <div class="pocket sav" onclick="openAdd('forecast')"><div><div class="plabel">${esc(S.settings.savName||"Savings")} account</div>${mask4(S.settings.savLast4)?`<div class="plast">${mask4(S.settings.savLast4)}</div>`:""}</div><div><div class="phint">Available balance</div><div class="pamt">${money(S.settings.savings)}</div><div class="goldline"></div></div></div>
  <div class="pocket efund" onclick="openAdd('forecast')"><div><div class="plabel">${esc(S.settings.efundName||"Emergency")} account</div>${mask4(S.settings.efundLast4)?`<div class="plast">${mask4(S.settings.efundLast4)}</div>`:""}</div><div><div class="phint">Available balance</div><div class="pamt">${money(S.settings.emergency)}</div><div class="goldline"></div></div></div>
</div>
<div class="totalcard"><div class="row" style="justify-content:flex-start;gap:10px;align-items:flex-start">${ico("pie")}<div><div class="tiny">Total now</div><div class="amount">${money(liquidCash())}</div></div></div><div class="goldline"></div>
<div class="row" style="margin-top:12px"><div class="tiny">Expected ${nextFirst()}</div><div class="amount ${monthEndRow.delta>=0?"pos":"neg"}" style="font-size:18px">${money(monthEndRow.total)}</div></div></div>
<button class="btn ghost" onclick="openSheet(formHTML('transfer'))">Move between accounts</button>
${tightEnvelopes()}
<div class="section-title"><span>Recent</span><button class="sec-link" onclick="lastSpendUndo()">Undo last</button></div>
<div class="card">${recent.map(x=>`<div class="list-item" onclick="openEdit('spend','${x.id}')"><div class="row" style="align-items:center"><div class="row" style="justify-content:flex-start;gap:12px"><div class="tx-ico">${ico(catIcon(x.kind))}</div><div><div class="title">${esc(x.label)}</div><div class="tiny">${x.date}</div></div></div><div class="amount">${money(x.amount)}</div></div></div>`).join("")||`<div class="empty">No spend yet.</div>`}</div>`;}

function allPayRows(from,through){
  return S.jobs.flatMap(j=>payDatesFrom(j,through).filter(d=>d>=from).map(d=>({j,d,amt:estimatePay(j,d),got:d<=todayISO()}))).sort((a,b)=>a.d.localeCompare(b.d)||a.j.name.localeCompare(b.j.name));
}
function payCycleRows(){
  const rows=allPayRows(addMonths(todayISO(),-3),addMonths(todayISO(),4));
  const past=rows.filter(r=>r.got).slice(-2);
  const next=rows.filter(r=>!r.got).slice(0,2);
  return [...past,...next];
}
function moneyHTML(){const m=monthKey();
const monthPays=allPayRows(m+"-01",monthEnd(m));
const monthIn=monthPays.reduce((a,p)=>a+Number(p.amt||0),0);
const cycle=payCycleRows();
const list=[...S.spend].sort((a,b)=>(b.date||"").localeCompare(a.date||""));const monthSp=list.filter(x=>(x.date||"").startsWith(m)).reduce((a,b)=>a+Number(b.amount),0);
return `<div class="heroes">
  <div class="hero blue"><div class="plabel">In this month</div><div><div class="phint" style="opacity:.7;font-size:11px">Paycheques</div><div class="pamt">${money(monthIn)}</div><div class="goldline"></div></div></div>
  <div class="hero gold"><div class="plabel">Spent</div><div><div class="phint" style="opacity:.7;font-size:11px">This month</div><div class="pamt">${money(monthSp)}</div><div class="goldline"></div></div></div>
</div>
<div class="section-title">This pay cycle</div>
<div class="card tint-blue">${cycle.map(({j,d,amt,got})=>`<div class="list-item pay-row ${got?"got":""}" onclick="${j.kind==="hourly"?`openHours('${j.id}')`:`openEdit('job','${j.id}')`}"><div class="row"><div><div class="title">${esc(j.name)}</div><div class="tiny">${d} · ${got?"received":"upcoming"}</div></div><div class="amount pos">${money(amt)}</div></div></div>`).join("")||`<div class="empty">No pays yet.</div>`}
<button class="btn ghost" onclick="const h=S.jobs.find(j=>j.kind==='hourly');if(h)openHours(h.id);else alert('No hourly job');">Log hourly hours</button>
</div>
<div class="section-title">Bills</div>
<div class="card tint-gold">${(S.bills||[]).length?S.bills.map(b=>`<div class="list-item"><div class="row" style="align-items:center;gap:12px"><span onclick="event.stopPropagation();toggleBillPaid('${b.id}')" style="width:28px;height:28px;border-radius:8px;border:1px solid ${billIsPaid(b)?"var(--gold)":"var(--line)"};background:${billIsPaid(b)?"var(--gold)":"transparent"};color:#1a140c;display:inline-grid;place-items:center;font-size:16px;font-weight:700;flex-shrink:0">${billIsPaid(b)?"✓":""}</span><div onclick="openEdit('bill','${b.id}')" style="flex:1"><div class="title">${esc(b.name)}</div><div class="tiny">${b.frequency} · due ${b.next||"—"} · ${b.mode==="transfer"?(accountLabel(b.from)+" → "+accountLabel(b.to||"emergency")):accountLabel(b.from)} · ${billIsPaid(b)?"done":"due"}</div></div><div style="text-align:right"><b class="neg">${money(b.amount)}</b><div class="tiny" onclick="openEdit('bill','${b.id}')">Edit</div></div></div></div>`).join(""):`<div class="empty">Add rent with +</div>`}</div>
<div class="section-title">Activity</div>
<div class="card">${list.slice(0,30).map(x=>`<div class="list-item" onclick="openEdit('spend','${x.id}')"><div class="row" style="align-items:center"><div class="row" style="justify-content:flex-start;gap:12px"><div class="tx-ico">${ico(catIcon(x.category))}</div><div><div class="title">${esc(x.name||x.category)}</div><div class="tiny">${x.category} · ${x.date}</div></div></div><div class="amount">${money(x.amount)}</div></div></div>`).join("")||`<div class="empty">No purchases.</div>`}</div>`;}

function planHTML(){const p=planStats();const quick=[["Groceries","spend","Groceries"],["Gas","spend","Transport"],["Dining","spend","Dining"],["Housing","spend","Housing"],["Debt","debt","Debt"]].filter(([n])=>!(S.envelopes||[]).some(e=>e.name===n));
const rows=(S.envelopes||[]).map(e=>{const used=envelopeUsed(e),cap=Number(e.amount)||0,remain=cap-used,recent=potTxns(e).slice(0,3);
return `<div class="card rail"><div class="row" style="align-items:center"><div onclick="spendFromPot('${e.id}')"><div class="title">${esc(e.name)}</div></div><div class="row" style="gap:8px;justify-content:flex-end"><input class="env-amt" style="width:92px;text-align:right" type="number" step="0.01" value="${cap||""}" onchange="setEnvelopeAmt('${e.id}',this.value)"><button class="icon-btn" style="width:34px;height:34px;font-size:18px" onclick="event.stopPropagation();delEnvelope('${e.id}')">×</button></div></div><div class="bar"><i style="width:${cap?clamp(used/cap*100,0,100):0}%"></i></div><div class="row" style="margin-top:8px"><div class="tiny">${potFilled(e)?"Pot filled":"Not filled yet"} · used ${money(used)}</div><div class="amount ${remain<0?"neg":"pos"}">${remain<0?"Over "+money(Math.abs(remain)):money(remain)+" left"}</div></div>
<button class="btn" style="margin-top:12px" onclick="spendFromPot('${e.id}')">Pull from ${esc(e.name)}</button>
${recent.length?recent.map((x,i)=>`<div class="list-item" style="padding-top:${i?8:4}px"><div class="row"><div><div class="tiny">${i===0?"Recent":""}</div><div class="title">${esc(x.name||x.category)} · ${x.date}</div></div><div style="text-align:right"><div class="amount">${money(x.amount)}</div><div class="tiny" style="color:var(--red)" onclick="deleteSpend('${x.id}')">Delete</div></div></div></div>`).join(""):`<div class="tiny" style="margin-top:8px">No pulls yet.</div>`}
</div>`;}).join("");
const path=monthPath(6);
const monthNames=mk=>{const [y,m]=mk.split("-");return new Date(Number(y),Number(m)-1,1).toLocaleDateString(undefined,{month:"short",year:"numeric"});};
const proj=`<div class="section-title">Cash by month</div><div class="card tint-blue"><div class="tiny" style="margin-bottom:8px">In accounts is chequing + savings only. Emergency is treated as already set aside, so a transfer there looks like a loss this month.</div>
<table class="months"><tr><th>Month</th><th class="r">In accounts</th><th class="r">Change</th></tr>
${path.map(r=>`<tr><td>${monthNames(r.month)}</td><td class="r">${money(r.total)}</td><td class="r ${r.delta>=0?"pos":"neg"}">${money(r.delta,true)}</td></tr>`).join("")}
</table></div>`;
return `<div class="heroes">
  <div class="hero blue wide"><div class="plabel">Avg monthly income</div><div><div class="pamt">${money(p.income)}</div><div class="goldline"></div>
    <div class="kpi" style="margin-top:12px"><div><div class="tiny">Assigned</div><div class="title" style="color:#f7f4ee">${money(p.allocated)}</div></div><div><div class="tiny">Left to assign</div><div class="title" style="color:#e8d5b0">${money(p.left)}</div></div></div>
    <div class="tiny" style="margin-top:10px">Pots ${money(p.pots)} · loans ${money(p.debtMins)} · bills ${money(p.bills)} · goals ${money(p.goals||0)}</div>
  </div></div>
</div>
<button class="btn" onclick="fillPots()">Fill pots for this month</button>
${proj}
<div class="section-title"><span>Envelopes</span><button class="sec-link" onclick="openAdd('envelope')">+ Add</button></div>${rows||`<div class="card empty">Add groceries, gas, or any pot.</div>`}
<div class="section-title"><span>Bills</span><button class="sec-link" onclick="openAdd('bill')">+ Add</button></div>
<div class="card tint-gold">${(S.bills||[]).length?S.bills.map(b=>`<div class="list-item"><div class="row" style="align-items:center;gap:12px"><span onclick="event.stopPropagation();toggleBillPaid('${b.id}')" style="width:28px;height:28px;border-radius:8px;border:1px solid ${billIsPaid(b)?"var(--gold)":"var(--line)"};background:${billIsPaid(b)?"var(--gold)":"transparent"};color:#1a140c;display:inline-grid;place-items:center;font-size:16px;font-weight:700;flex-shrink:0">${billIsPaid(b)?"✓":""}</span><div onclick="openEdit('bill','${b.id}')" style="flex:1"><div class="title">${esc(b.name)}</div><div class="tiny">${b.frequency} · due ${b.next||"—"} · ${b.mode==="transfer"?(accountLabel(b.from)+" → "+accountLabel(b.to||"emergency")):accountLabel(b.from)} · ${billIsPaid(b)?"done":"due"}</div></div><div class="amount neg">${money(b.amount)}</div></div></div>`).join(""):`<div class="empty">Add rent or other fixed costs.</div>`}</div>
<div class="section-title"><span>Goals</span><button class="sec-link" onclick="openAdd('goal')">Add</button></div>
${(S.goals||[]).map(g=>{const n=goalNeed(g);return `<div class="card" onclick="openEdit('goal','${g.id}')"><div class="row"><div class="title">${esc(g.name)}</div><span class="chip">${g.date}</span></div><div class="bar"><i style="width:${g.target?clamp((g.saved||0)/g.target*100,0,100):0}%"></i></div><div class="row" style="margin-top:8px"><div class="tiny">${money(g.saved||0)} of ${money(g.target)}</div><div class="amount gold">${money(n.monthly)}/mo</div></div></div>`;}).join("")||`<div class="card empty">Add a dated goal.</div>`}
<div class="section-title">Suggestions</div><div class="card">${coachTips().map(t=>`<div class="list-item tiny" style="color:var(--text)">${esc(t)}</div>`).join("")}</div>`;}

function moreHTML(){const t=totals();const m=monthKey();
const osap=S.debts.find(d=>/OSAP/i.test(d.name));
const osapPaid=osap?Number((osap.paidMonth||{})[m]||0)+(Number(osap.minPay)||0):0;
return `<div class="heroes">
  <div class="hero gold"><div class="plabel">Total owed</div><div><div class="pamt">${money(t.debtP)}</div><div class="goldline"></div></div></div>
  ${osap?`<div class="hero blue"><div class="plabel">OSAP this month</div><div><div class="pamt">${money(osapPaid)}</div><div class="goldline"></div><div class="tiny">Min ${money(osap.minPay||0)} + extras</div></div></div>`:`<div class="hero blue"><div class="plabel">Loans</div><div><div class="pamt">${S.debts.length}</div><div class="goldline"></div></div></div>`}
</div>
<div class="section-title">Loans</div>
${S.debts.map(d=>{const acc=accrued(d),mo=monthlyInterest(d);
return `<div class="card rail tint-gold" onclick="openEdit('debt','${d.id}')">
  <div class="row"><div><div class="title">${esc(d.name)}</div><div class="tiny">${d.apr}% APR · since ${d.start||"—"}</div></div><div class="amount">${money(d.principal)}</div></div>
  <div class="row" style="margin-top:10px"><div class="tiny">Interest accrued</div><div class="amount neg">${money(acc)}</div></div>
  <div class="row"><div class="tiny">Balance with interest</div><div class="tiny">${money(Number(d.principal)+acc)}</div></div>
  <div class="tiny" style="margin-top:8px">${money(mo)}/mo · min ${money(d.minPay||0)} · extra this month ${money((d.paidMonth||{})[m]||0)} · ${accountLabel(d.from)}</div>
</div>`;}).join("")}
<div class="section-title">Investments</div>
${S.invest.map(x=>`<div class="card rail blue tint-blue" onclick="openEdit('invest','${x.id}')"><div class="row"><div class="title">${esc(x.name)}</div><div class="amount">${money(x.value)}</div></div></div>`).join("")||`<div class="card empty tint-blue">Add TFSA / RRSP with +</div>`}
<div class="section-title">Profile</div><div class="card" onclick="showView('settings')"><div class="row"><div class="title">Name, accounts, photo</div><div class="tiny">Open</div></div></div>`;}

function settingsHTML(){return `<div class="section-title">You</div><div class="card">
<label>Your name</label><input value="${esc(S.settings.name)}" onchange="S.settings.name=this.value;save();render();">
<label>Chequing name</label><input value="${esc(S.settings.cheqName)}" onchange="S.settings.cheqName=this.value;save();render();">
<label>Savings name</label><input value="${esc(S.settings.savName)}" onchange="S.settings.savName=this.value;save();render();">
<div class="split"><div><label>Chequing</label><input type="number" step="0.01" value="${S.settings.chequing||""}" onchange="S.settings.chequing=parseFloat(this.value||0)||0;save();"></div><div><label>Savings</label><input type="number" step="0.01" value="${S.settings.savings||""}" onchange="S.settings.savings=parseFloat(this.value||0)||0;save();"></div></div>
<div class="split"><div><label>Chequing last 4</label><input maxlength="4" value="${esc(S.settings.cheqLast4||"")}" onchange="S.settings.cheqLast4=this.value.replace(/\\D/g,'').slice(-4);save();render();"></div><div><label>Savings last 4</label><input maxlength="4" value="${esc(S.settings.savLast4||"")}" onchange="S.settings.savLast4=this.value.replace(/\\D/g,'').slice(-4);save();render();"></div></div>
<label>Paycheques land in</label><select onchange="S.settings.incomeAccount=this.value;save();"><option value="chequing" ${S.settings.incomeAccount!=="savings"?"selected":""}>Chequing</option><option value="savings" ${S.settings.incomeAccount==="savings"?"selected":""}>Savings</option></select>
<button class="btn ghost" onclick="document.getElementById('avatarPick').click()">Choose photo</button>
</div>
<div class="section-title">Cloud login</div><div class="card">
<div class="tiny">${cloudStatus()}${fbUser?" · data is saved to Firebase for this email.":" · create an account so phone and computer match."}</div>
${fbUser?`<button class="btn ghost" onclick="authSignOut()">Sign out</button>`:`<button class="btn" onclick="showAuth()">Open sign in</button>`}
<label>Firebase config JSON</label>
<textarea id="f-fb" rows="7" style="width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px">${esc(JSON.stringify(fbConfig()||FIREBASE,null,2))}</textarea>
<button class="btn ghost" onclick="saveFirebaseCfg()">Save config & reload</button>
</div>

<div class="card"><button class="btn" onclick="exportData()">Export backup</button><button class="btn ghost" onclick="document.getElementById('imp').click()">Import</button><input id="imp" type="file" accept="application/json" style="display:none" onchange="importData(event)"><button class="btn danger" onclick="if(confirm('Erase all?')){S=defaultState();save();render();}">Erase data</button></div>`;}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="stack-backup.json";a.click();}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(defaultState(),JSON.parse(r.result));save();render();}catch(err){alert("Bad file");}};r.readAsText(f);}

function render(){syncJobPays();runDuePayments();document.documentElement.setAttribute("data-theme",S.settings.theme==="light"?"light":"dark");
document.getElementById("hello").textContent=view==="home"?greeting():({money:"Money",plan:"Plan",more:"More",settings:"Settings"}[view]||"Stack");
document.getElementById("todayLabel").textContent=view==="home"?"Here is your account overview.":new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
const bw=document.querySelector(".brandword");if(bw)bw.style.visibility=view==="home"?"visible":"hidden";
paintAvatar();
const pages={home:homeHTML,money:moneyHTML,plan:planHTML,more:moreHTML,settings:settingsHTML};
document.getElementById("content").innerHTML=(pages[view]||homeHTML)();}
window.onerror=function(m,s,l,c,e){const n=document.getElementById("content");if(n)n.innerHTML="<div class=card><div class=tiny>Load error</div><div>"+String(m||e)+"</div></div>";console.error(m,s,l,e);};
try{initFirebase();render();}catch(e){console.error(e);const n=document.getElementById("content");if(n)n.innerHTML="<div class=card>Load error: "+e.message+"</div>";}

</script>
</body></html>
